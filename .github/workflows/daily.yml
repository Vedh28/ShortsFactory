name: Daily Hindi brainrot video

on:
  schedule:
    # 09:00 Asia/Kolkata (UTC+05:30)
    - cron: "30 3 * * *"
    # 19:00 Asia/Kolkata (UTC+05:30)
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      test_upload:
        description: "Publish one new test video with a separate slot from the daily schedule"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-historical-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TELEGRAM_CONFIGURED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}

    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Restore YouTube OAuth credentials
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_CLIENT_JSON" ] || [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "Add YOUTUBE_CLIENT_SECRET_JSON and YOUTUBE_TOKEN_JSON repository secrets."
            exit 1
          fi
          printf '%s' "$YOUTUBE_CLIENT_JSON" > client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube_token.json

      - name: Generate and publish the video
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
          NVIDIA_LITE_MODEL: nvidia/nemotron-3.5-bolt-e4b
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MODEL: eleven_v4
          ELEVENLABS_VOICE_ID: JBFqnCBsd6RMkjVDRZzb
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_IMAGE_SPACE_ID: saasr9/zerogpu-gen
          HF_VIDEO_SPACE_ID: zerogpu-aoti/wan2-2-fp8da-aoti-faster
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VIDEO_MODEL: x-ai/grok-imagine-video-1.5-lite
          MIN_VIDEO_SECONDS: "30"
          MAX_VIDEO_SECONDS: "50"
          NARRATION_SPEED: "1.15"
          BRAINROT_PUNCH_UP: "true"
          CONTAINS_SYNTHETIC_MEDIA: "true"
          SCHEDULE_SLOT: ${{ github.event.schedule == '30 3 * * *' && '09:00' || github.event.schedule == '30 13 * * *' && '19:00' || '' }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ] || [ -z "$ELEVENLABS_API_KEY" ] || [ -z "$HF_TOKEN" ]; then
            echo "Add NVIDIA_API_KEY, ELEVENLABS_API_KEY, and the free HF_TOKEN repository secret."
            exit 1
          fi
          if [ "${{ inputs.test_upload }}" = "true" ]; then
            python shorts_maker.py --test-upload
          else
            python shorts_maker.py
          fi

      - name: Save the generated video for download
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: brainrot-video-${{ github.run_number }}
          path: output/[0-9][0-9][0-9][0-9].mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Persist idea and upload-slot state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist generated video history"
          git push

      - name: Notify on failure with Telegram (optional)
        if: ${{ failure() && env.TELEGRAM_CONFIGURED == 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail --silent --show-error --max-time 20 \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=ShortsFactory failed: ${RUN_URL}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
