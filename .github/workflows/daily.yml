name: Daily historical video

on:
  schedule:
    # 09:17 Asia/Kolkata (UTC+05:30). Off the hour to reduce scheduler delays.
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-historical-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Restore YouTube OAuth credentials
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_CLIENT_JSON" ] || [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "Add YOUTUBE_CLIENT_SECRET_JSON and YOUTUBE_TOKEN_JSON repository secrets."
            exit 1
          fi
          printf '%s' "$YOUTUBE_CLIENT_JSON" > client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube_token.json

      - name: Generate and publish the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MODEL: eleven_v4
          ELEVENLABS_VOICE_ID: JBFqnCBsd6RMkjVDRZzb
          KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
          KLING_RESOLUTION: 1080p
          KLING_TIMEOUT_SECONDS: "2400"
          CONTENT_GENRE: historical and informative
          MIN_VIDEO_SECONDS: "90"
          NARRATION_SPEED: "0.9"
          CONTAINS_SYNTHETIC_MEDIA: "true"
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$ELEVENLABS_API_KEY" ] || [ -z "$KLING_API_KEY" ]; then
            echo "Add GEMINI_API_KEY, ELEVENLABS_API_KEY, and KLING_API_KEY repository secrets."
            exit 1
          fi
          python shorts_maker.py

      - name: Save the generated video for download
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: historical-video-${{ github.run_number }}
          path: output/[0-9][0-9][0-9][0-9].mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Persist topic history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist generated video history"
          git push
